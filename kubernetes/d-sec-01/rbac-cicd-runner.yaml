apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cicd-deploy-role
  namespace: fds-app
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-deploy-binding
  namespace: fds-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cicd-deploy-role
subjects:
  - kind: ServiceAccount
    name: cicd-runner-sa
    namespace: ci-cd
