apiVersion: apps/v1
kind: Deployment
metadata:
  name: fds-engine
  namespace: fds
  labels:
    app: fds-engine
spec:
  # E-K3S(edge01 단일 노드) 시연: replicas=1.
  #   Prometheus 가 ClusterIP 로 스크레이프하는데(파드 IP 직결 "No route to host") replica 가
  #   여럿이면 매 스크레이프가 다른 파드로 라운드로빈돼 fds_detected_total 카운터가 리셋으로
  #   오인된다 → increase()/rate() 오탐. 1 replica 면 단일 시계열이라 FDSDetectionBurst 정상 동작.
  # E-CANON(정본 다중 노드): replicas=3 + headless-services.yaml 로 파드 단위 스크레이프.
  replicas: 1
  selector:
    matchLabels:
      app: fds-engine
  template:
    metadata:
      labels:
        app: fds-engine
    spec:
      serviceAccountName: fds-engine
      hostPID: false
      hostIPC: false
      hostNetwork: false
      imagePullSecrets:
        - name: harbor-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: fds-engine
          image: 10.1.93.54/fds/fds-engine:v0.1.0
          ports:
            - containerPort: 8001
              name: http
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # 외부 의존성 없음 → startupProbe 불필요, /health 하나로 충분
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 192Mi
      volumes:
        - name: tmp
          emptyDir: {}
