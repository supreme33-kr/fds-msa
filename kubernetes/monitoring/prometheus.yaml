apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fds
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'transaction-api'
        static_configs:
          - targets: ['transaction-api.fds.svc.cluster.local:80']
      - job_name: 'fds-engine'
        static_configs:
          - targets: ['fds-engine.fds.svc.cluster.local:8001']
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['10.1.93.50:9100']
        # 주의: 실제 3-Worker 클러스터에서는 Prometheus가 monitor01(외부 VM)에
        # 위치하므로 hairpin 문제가 없다. 이 target 방식(노드 IP 직접 지정)은
        # Baseline IF-06(monitor01 → CP/Worker TCP 9100)과 일치하는 정석 방식.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: tmp
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fds
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
