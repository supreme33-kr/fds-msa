apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fds
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/rules/alert-rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.fds.svc.cluster.local:9093']
    scrape_configs:
      - job_name: 'transaction-api'
        static_configs:
          - targets: ['transaction-api.fds.svc.cluster.local:80']
      - job_name: 'fds-engine'
        static_configs:
          - targets: ['fds-engine.fds.svc.cluster.local:8001']
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['10.1.93.50:9100']
        # 주의: 실제 3-Worker 클러스터에서는 Prometheus가 monitor01(외부 VM)에
        # 위치하므로 hairpin 문제가 없다. 이 target 방식(노드 IP 직접 지정)은
        # Baseline IF-06(monitor01 → CP/Worker TCP 9100)과 일치하는 정석 방식.
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring-api.svc.cluster.local:8080']

      # --- A4 (시나리오 v1.4 §2) : kubelet(10250) scrape 타깃 ---
      # RBAC: prometheus-rbac.yaml (ServiceAccount prometheus + ClusterRole nodes/metrics).
      # 네트워크: allow-prometheus-egress-kubelet.yaml (fds ns egress → .50:10250).
      #
      # ⚠️ edge01 단일 노드 k3s 에서는 이 타깃이 DOWN 이다("No route to host" — pod 가 자기
      #    노드 IP :10250 으로 도달 불가). node-exporter(:9100) 와 동일한 hairpin 제약이며
      #    시나리오 §6 탐지 한계로 정직하게 발표한다. 알림은 KubeletScrapeDownK3s(info) 로만,
      #    S8/TargetDown 대상에서는 제외.
      # ✅ 실 6-Node 클러스터: Prometheus 가 monitor01(외부 VM) 에 위치 → hairpin 없음.
      #    static targets 를 .102~.105/.107/.108:10250 로 교체하거나 kubernetes_sd(role: node) 전환.
      - job_name: 'kubelet'
        scheme: https
        tls_config:
          insecure_skip_verify: true      # k3s kubelet 자가서명. 실 클러스터는 CA 지정 권장.
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets: ['10.1.93.50:10250']
      - job_name: 'kubelet-cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets: ['10.1.93.50:10250']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # A4: kubelet scrape 인증용. default SA 로는 nodes/metrics 권한이 없다.
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--web.enable-lifecycle"   # curl -X POST /-/reload 로 룰/설정 재적용
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: tmp
              mountPath: /prometheus
            - name: alert-rules
              mountPath: /etc/prometheus/rules/
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: tmp
          emptyDir: {}
        - name: alert-rules
          configMap:
            name: prometheus-alert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fds
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
