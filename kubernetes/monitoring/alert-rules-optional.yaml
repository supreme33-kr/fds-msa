# 선택적 고도화 후보 알림 (v1.5 §1) — 기존 P0 에 자동 편입하지 않는다. 임계값 전부 NOT VERIFIED.
#
# ⚠️ E-CANON 전용. E-K3S(edge01 단일 노드)에는 적용하지 않는다:
#    앱을 ClusterIP 로 스크레이프하므로(파드 IP 직결 불가) replica 3 라운드로빈에 의해
#    increase()/rate() 가 부풀어 FDSDetectionBurst 계열이 상시 오탐(firing)한다.
#    → E-CANON 에서 파드 단위 스크레이프(headless-services.yaml + dns_sd) 전환 후 이 파일을 적용.
#
# prometheus.yml 의 rule_files 는 /etc/prometheus/rules-opt/*.yml 도 glob 하며,
# 해당 volume 은 configMap optional: true 라 이 ConfigMap 이 없어도 Prometheus 는 정상 기동한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules-optional
  namespace: fds
data:
  alert-rules-optional.yml: |
    groups:
    - name: fds-optional-hardening
      rules:

      # 한 계정 연속·반복 거래로 특정 Rule 탐지가 급증하는 패턴.
      # rule_id 는 응답의 fds_rules[].triggered 로 확인하고 특정하지 않는다. 예시로 R02 고정.
      - alert: FDSDetectionBurst
        expr: sum(increase(fds_detected_total{rule_id="R02"}[5m])) > 20
        for: 1m
        labels:
          severity: warning
          rule_id: "R02"
          tier: "optional-hardening"
        annotations:
          summary: "FDS R02 탐지 급증 (5m 증가분 > 20, threshold NOT VERIFIED)"
          description: "선택적 고도화 후보. 거래는 201 유지(차단 없음) — 탐지·기록만."

      - alert: FDSDetectionBurstAnyRule
        expr: sum by (rule_id) (increase(fds_detected_total[5m])) > 30
        for: 2m
        labels:
          severity: info
          tier: "optional-hardening"
        annotations:
          summary: "FDS {{ $labels.rule_id }} 탐지 급증 (참고, threshold NOT VERIFIED)"
          description: "rule_id 별 5분 증가분 > 30. 선택적 고도화 후보."

      # S1 보조(횡이동/비승인 워크로드 흔적). [BL] §11.3 에 NetworkPolicy drop 지표 없음(P1-MON-02).
      # kube_pod_labels{label_app} 은 ksm --metric-labels-allowlist=pods=[app] 필요.
      # 대체(라벨 불가 시): count(kube_pod_info{namespace="fds"}) > 9
      - alert: UnexpectedPodInFdsNs
        expr: |
          count(
            kube_pod_info{namespace="fds"}
            unless on (namespace, pod)
            kube_pod_labels{namespace="fds", label_app=~"transaction-api|fds-engine|prometheus|grafana|alertmanager"}
          ) > 0
        for: 2m
        labels:
          severity: warning
          tier: "optional-hardening"
        annotations:
          summary: "fds namespace 에 승인되지 않은 파드 존재"
          description: "예상 app 라벨이 아닌 파드가 fds ns 에서 관측됨. 선택적 고도화 후보, coarse heuristic."
