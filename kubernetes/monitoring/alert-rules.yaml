apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: fds
data:
  alert-rules.yml: |
    groups:
    - name: fds-demo-alerts
      rules:
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "node-exporter target is down"
          description: "Prometheus cannot scrape node-exporter (known hairpin issue on edge01 single-node k3s)."
