apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: fds
data:
  # 알림 규칙 — 시나리오 v1.5 정렬.
  #
  #  group fds-core-observability : 타깃/스크레이프 건강. S8(TC-TARGET) 대상.
  #  group fds-optional-hardening : FDSDetectionBurst 등 "선택적 고도화 후보"(v1.5 §1).
  #                                기존 P0 에 자동 편입하지 않는다. 임계값 전부 NOT VERIFIED.
  #
  #  S7b(TC-ALERT) 의 P0 Test Alert 는 별도 파일 p0-test-alert.yaml 로 관리한다.
  #
  # Prometheus 는 rule 파일을 자동 reload 하지 않는다 → ConfigMap 변경 후
  #   kubectl -n fds exec deploy/prometheus -- wget -qO- --post-data='' localhost:9090/-/reload
  alert-rules.yml: |
    groups:
    - name: fds-core-observability
      rules:

      # node-exporter : k3s 단일노드 hairpin 로 상시 DOWN. 실 6노드(.105/.107/.108:9100)에서 정석.
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 30s
        labels:
          severity: warning
          known_issue: "k3s-hairpin"
        annotations:
          summary: "node-exporter target is down"
          description: "edge01 단일 노드 k3s hairpin 로 DOWN. 실 6노드에서는 정석 타깃. S8 대상 아님."

      # kubelet(10250) : pod→노드 자기 IP 도달 제약(No route to host). node-exporter 와 동일 원인.
      - alert: KubeletScrapeDownK3s
        expr: up{job=~"kubelet|kubelet-cadvisor"} == 0
        for: 2m
        labels:
          severity: info
          known_issue: "k3s-hairpin"
        annotations:
          summary: "kubelet scrape down (edge01 k3s 단일노드 hairpin)"
          description: "pod→노드 IP(:10250) 도달 제약. 실 6노드(.102~.105/.107/.108:10250)에서는 정석. S8 대상 아님."

      # S8 / TC-TARGET : 스크레이프 타깃 다운. node-exporter/kubelet 은 위 known-issue 로 분리 → 제외.
      - alert: TargetDown
        expr: up{job=~"transaction-api|fds-engine|kube-state-metrics"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "scrape target {{ $labels.job }} is down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 를 1분 이상 스크레이프하지 못함."

    - name: fds-optional-hardening
      # v1.5 §1 : 아래는 "선택적 고도화 후보". 기존 P0 Test Alert(S7b) 와 별개이며
      #           채택 전까지 임계값은 NOT VERIFIED. 발표에서 P0 로 소개하지 않는다.
      # ⚠️ E-K3S 제약: transaction-api/fds-engine 를 ClusterIP 로 스크레이프하므로(파드 IP 직결
      #    불가) replica 3 라운드로빈에 의해 increase()/rate() 가 부풀어 이 그룹은
      #    E-K3S 에서 신뢰할 수 없다. E-CANON 에서 파드 단위 스크레이프로 전환 후 유효.
      rules:

      # 한 계정 연속·반복 거래로 특정 Rule 탐지가 급증하는 패턴.
      # rule_id 는 응답의 fds_rules[].triggered 로 확인하고 특정하지 않는다. 예시로 R02 고정.
      - alert: FDSDetectionBurst
        expr: sum(increase(fds_detected_total{rule_id="R02"}[5m])) > 20
        for: 1m
        labels:
          severity: warning
          rule_id: "R02"
          tier: "optional-hardening"
        annotations:
          summary: "FDS R02 탐지 급증 (5m 증가분 > 20, threshold NOT VERIFIED)"
          description: "선택적 고도화 후보. 거래는 201 유지(차단 없음) — 탐지·기록만."

      - alert: FDSDetectionBurstAnyRule
        expr: sum by (rule_id) (increase(fds_detected_total[5m])) > 30
        for: 2m
        labels:
          severity: info
          tier: "optional-hardening"
        annotations:
          summary: "FDS {{ $labels.rule_id }} 탐지 급증 (참고, threshold NOT VERIFIED)"
          description: "rule_id 별 5분 증가분 > 30. 선택적 고도화 후보."

      # S1 보조(횡이동/비승인 워크로드 흔적). [BL] §11.3 에 NetworkPolicy drop 지표 없음(P1-MON-02).
      # kube_pod_labels{label_app} 은 ksm --metric-labels-allowlist=pods=[app] 필요.
      # 대체(라벨 불가 시): count(kube_pod_info{namespace="fds"}) > 9
      - alert: UnexpectedPodInFdsNs
        expr: |
          count(
            kube_pod_info{namespace="fds"}
            unless on (namespace, pod)
            kube_pod_labels{namespace="fds", label_app=~"transaction-api|fds-engine|prometheus|grafana|alertmanager"}
          ) > 0
        for: 2m
        labels:
          severity: warning
          tier: "optional-hardening"
        annotations:
          summary: "fds namespace 에 승인되지 않은 파드 존재"
          description: "예상 app 라벨이 아닌 파드가 fds ns 에서 관측됨. 선택적 고도화 후보, coarse heuristic."
